<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Complexity Checker</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>Password Complexity Checker</h1>
        <div class="password-container">
            <input type="password" id="password" placeholder="Enter your password">
            <button id="toggle-password">Show</button>
        </div>
        
        <div class="button-container">
            <button id="submit-password">Save Password</button>
        </div>
        
        <div class="strength-meter">
            <div class="meter-bar">
                <div id="strength-bar"></div>
            </div>
            <p id="strength-text">Password strength: <span id="strength-value">None</span></p>
        </div>
        
        <div class="criteria">
            <h2>Password Criteria:</h2>
            <ul>
                <li id="length">At least 8 characters</li>
                <li id="uppercase">At least one uppercase letter</li>
                <li id="lowercase">At least one lowercase letter</li>
                <li id="number">At least one number</li>
                <li id="special">At least one special character</li>
            </ul>
        </div>
        
        <div class="feedback">
            <h2>Feedback:</h2>
            <p id="feedback-text">Enter a password to receive feedback.</p>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
